SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "fp16"

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0
    USING_ENSEMBLE: True

    FREQUENCY:
      ENABLED: True

      LOW_CUTOFF: 0.18
      HIGH_CUTOFF: 0.45
      FFT_BATCH_SIZE: 8
      FFT_DEVICE: "auto"
      VIEW_MODE: "natural"
      HIGH_ENHANCE: 0.5
      CENTER_RESIDUAL_BANDS: True
      NOVEL_VISION_CALIBRATION: False

      SEMANTIC_WEIGHT: 0.25
      MAX_SEMANTIC_WEIGHT: 0.65
      SEMANTIC_GATE_MODE: "attenuate"
      DESCRIPTION_WEIGHT: 0.5
      USE_EXPLICIT_DESCRIPTIONS: False
      EXPLICIT_DESCRIPTION_PATH: ""
      DESCRIPTION_TOPK: 3
      DESCRIPTION_TEMPERATURE: 0.07
      UNCERTAINTY_SCALE: 2.0

      ALIGNMENT_SCALE: 4.0
      FUSION_TEMPERATURE: 1.0
      ADAPTIVE_FUSION: True
      BAND_PRIOR: [1.0, 1.0, 1.0]

      # Retained for the legacy path and the optional class-alpha ablation.
      FREQ_ALPHA: 0.20
      RELIABILITY_ALPHA: True
      MIN_FREQ_ALPHA: 0.0
      RELIABILITY_UNCERTAINTY_SCALE: 2.0
      RELIABILITY_SHOT_TAU: 5.0
      RELIABILITY_POWER: 1.0

      ROUTER:
        ENABLED: True
        HIDDEN_DIM: 64
        DROPOUT: 0.1
        NULL_LOGIT_BIAS: 2.0

        # Base-session pseudo FSCIL meta-training.
        TRAIN_STEPS: 400
        EPISODE_WAY: 10
        EPISODE_OLD_WAY: 5
        OLD_SHOT: 20
        SHOT: 5
        QUERY: 5

        LR: 0.001
        WEIGHT_DECAY: 0.0001
        ORACLE_TEMPERATURE: 0.2
        ROUTE_LOSS_WEIGHT: 0.5
        SAFE_KL_WEIGHT: 0.2
        NOVEL_LOSS_WEIGHT: 0.5
        GRAD_CLIP: 5.0
        LOG_INTERVAL: 100

        # Query routing supplies the residual strength.  Class alpha can be
        # enabled as an additional conservative reliability multiplier.
        MAX_ALPHA: 0.75
        USE_CLASS_ALPHA: False

      PROMPTS:
        - "a photo of a {}, emphasizing its global shape, silhouette, and coarse spatial layout."
        - "a photo of a {}, emphasizing its parts, spatial structure, and medium-scale patterns."
        - "a photo of a {}, emphasizing its fine texture, edges, colors, and local details."

      LOW_KEYWORDS: ["shape", "silhouette", "overall", "body", "size", "large", "small", "long", "round"]
      MIDDLE_KEYWORDS: ["part", "head", "wing", "tail", "leg", "beak", "spatial", "structure"]
      HIGH_KEYWORDS: ["texture", "pattern", "stripe", "spot", "color", "edge", "feather", "fur", "detail"]
