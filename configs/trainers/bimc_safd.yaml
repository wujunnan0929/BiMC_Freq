SEED: 1
DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"
DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 32
    BATCH_SIZE_INC: 32
  TEST:
    BATCH_SIZE: 32
  NUM_WORKERS: 4
MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
TRAINER:
  BiMC:
    PREC: "fp32"
    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5
    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0
    USING_ENSEMBLE: True
    FREQUENCY:
      # Joint GDA extracts the views; legacy probability fusion stays off.
      ENABLED: False
      BACKEND: "safd"
      VIEW_MODE: "natural"
      HIGH_ENHANCE: 0.25
      NOVEL_VISION_CALIBRATION: False
      SEMANTIC_GATE_MODE: "attenuate"
      FREQ_ALPHA: 0.20
      RELIABILITY_ALPHA: True
      SAFD:
        LOW_TERMS: 8
        MIDDLE_TERMS: 24
        RADII: [0.0, 0.3, 0.6, 0.8]
        ANGLES: 16
        MAX_SIGNALS: 96
        BATCH_SIZE: 2
        ORIGINAL_BLEND: [0.25, 0.1]
        MAX_DETAIL_RMS: 0.04
    # Shared covariance across the original and three SAFD feature vectors.
    # Only base training classes select ridge, temperature and mixing alpha.
    # Including alpha=0 allows exact fallback to the original BiMC scores.
    UNCERTAINTY:
      ENABLED: True
      VIEW_CONTROL: "joint"
      COVARIANCE: "full_shared"
      MEAN_UNCERTAINTY: False
      RIDGE: 0.1
      RIDGE_GRID: [0.01, 0.1, 1.0]
      AUTO_CALIBRATE: True
      ALPHA: 0.0
      ALPHA_GRID: [0.0, 0.05, 0.1, 0.2]
      TEMPERATURE: 1.0
      TEMPERATURE_GRID: [0.1, 0.3, 1.0]
      FIT_FRACTION: 0.5
      VAL_EPISODES: 20
      OLD_WAY: 10
      NEW_WAY: 5
      STAGES: 2
      OLD_SHOT: 20
      SHOT: 5
      QUERY: 5
