SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "fp16"
    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5
    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0
    USING_ENSEMBLE: False

ANALYSIS:
  FREQUENCY:
    ENABLED: True
    ANALYSIS_ONLY: True
    # Keep constrained residual-gate results separate from v2 outputs.
    OUTPUT_DIR: "./outputs/frequency_predictivity_v3"
    BAND_NAMES: ["low", "mid", "high"]
    BAND_MODE: "equal_energy"
    BAND_EDGES: [0.0, 0.15, 0.35, 1.0]
    ENERGY_SAMPLES_PER_CLASS: 20
    SAMPLES_PER_CLASS: 5
    WEIGHT_TEMPERATURE: 0.05
    # Strict FSCIL protocol: no future class names are used by support scores.
    COMPETITOR_SCOPE: "accumulated"
    FFT_DEVICE: "cpu"
    PREDICTIVITY:
      ENABLED: True
      # Final session contains every class and avoids repeated test-set encoding.
      EVAL_SCOPE: "final"
      BAND: "high"
      # Remove a class-logit column only when support contribution is below this.
      HARD_GATE_THRESHOLD: 0.0
      # Test-only sensitivity report; never select a threshold from test accuracy.
      THRESHOLD_SWEEP: [-0.05, -0.02, -0.01, -0.005, 0.0]
      SOFT_GATE_TEMPERATURE: 0.01
      RELIABILITY_EPS: 0.000001
      # Conservative gate uses mean + z * SEM before removing a band.
      CONFIDENCE_Z: 1.0
      # Residual fusion keeps at least 1-alpha of every full-image class logit.
      RESIDUAL_ALPHA: 0.2
      # Test-only sensitivity report; do not select alpha from test accuracy.
      RESIDUAL_ALPHA_SWEEP: [0.05, 0.1, 0.2, 0.3, 0.5]
      PAIRED_BOOTSTRAP_SAMPLES: 2000
      # Test-label local search is reported only as a leaked diagnostic ceiling.
      COORDINATE_ASCENT_MAX_PASSES: 3
      SAVE_SAMPLE_PREDICTIONS: True
      SAVE_LOGITS: True
