SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "fp16"

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0
    USING_ENSEMBLE: False

    # Keep the legacy CLIP frequency-view experiment disabled.  The branch
    # below is an independent third encoder, not another CLIP image view.
    FREQUENCY:
      ENABLED: False

    FREQUENCY_MODALITY:
      ENABLED: True

      # FFT log-magnitude descriptor: 16x16 pooled spectrum + 16 radial bins.
      GRID_SIZE: 16
      RADIAL_BINS: 16
      FFT_BATCH_SIZE: 16
      FFT_DEVICE: "auto"

      # Lightweight projection into the 512-D CLIP common embedding space.
      HIDDEN_DIM: 512
      DROPOUT: 0.1

      # One-time supervised alignment on base-session training samples.
      TRAIN_STEPS: 400
      BATCH_SIZE: 256
      LR: 0.001
      WEIGHT_DECAY: 0.0001
      LOGIT_SCALE: 16.0
      CLASSIFICATION_WEIGHT: 1.0
      IMAGE_ALIGNMENT_WEIGHT: 0.5
      LOG_INTERVAL: 100

      # Late probability fusion with the original CLIP image-text classifier.
      TEMPERATURE: 1.0
      FUSION_WEIGHT: 0.20
      RELIABILITY_ALPHA: True
      MIN_FUSION_WEIGHT: 0.0
      UNCERTAINTY_SCALE: 2.0
      SHOT_TAU: 5.0
      NOVEL_CALIBRATION: False
