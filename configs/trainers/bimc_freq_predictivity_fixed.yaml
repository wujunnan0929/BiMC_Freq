SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "fp16"
    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5
    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0
    USING_ENSEMBLE: False

ANALYSIS:
  FREQUENCY:
    ENABLED: True
    ANALYSIS_ONLY: True
    OUTPUT_DIR: "./outputs/frequency_predictivity_fixed_v3"
    BAND_NAMES: ["low", "mid", "high"]
    # Fixed radial bands make "high" the narrower [0.35, 1.0] intervention.
    BAND_MODE: "fixed"
    BAND_EDGES: [0.0, 0.15, 0.35, 1.0]
    ENERGY_SAMPLES_PER_CLASS: 20
    SAMPLES_PER_CLASS: 5
    WEIGHT_TEMPERATURE: 0.05
    COMPETITOR_SCOPE: "accumulated"
    FFT_DEVICE: "cpu"
    PREDICTIVITY:
      ENABLED: True
      EVAL_SCOPE: "final"
      BAND: "high"
      HARD_GATE_THRESHOLD: 0.0
      THRESHOLD_SWEEP: [-0.05, -0.02, -0.01, -0.005, 0.0]
      SOFT_GATE_TEMPERATURE: 0.01
      RELIABILITY_EPS: 0.000001
      CONFIDENCE_Z: 1.0
      RESIDUAL_ALPHA: 0.2
      RESIDUAL_ALPHA_SWEEP: [0.05, 0.1, 0.2, 0.3, 0.5]
      PAIRED_BOOTSTRAP_SAMPLES: 2000
      COORDINATE_ASCENT_MAX_PASSES: 3
      SAVE_SAMPLE_PREDICTIONS: True
      SAVE_LOGITS: True
