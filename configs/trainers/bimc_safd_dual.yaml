SEED: 1
DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"
DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 32
    BATCH_SIZE_INC: 32
  TEST:
    BATCH_SIZE: 32
  NUM_WORKERS: 4
MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
TRAINER:
  BiMC:
    PREC: "fp32"
    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5
    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0
    USING_ENSEMBLE: True
    RESIDUAL:
      ENABLED: False
      SAVE_CHECKPOINT: True
    CONSENSUS:
      ENABLED: False
    FREQUENCY:
      ENABLED: False
      BACKEND: "safd"
      VIEW_MODE: "natural"
      HIGH_ENHANCE: 0.25
      NOVEL_VISION_CALIBRATION: False
      USE_EXPLICIT_DESCRIPTIONS: True
      EXPLICIT_DESCRIPTION_PATH: "description/cub200_frequency_descriptions_deepseek.json"
      DESCRIPTION_TOPK: 3
      DESCRIPTION_TEMPERATURE: 0.07
      ROUTER:
        ENABLED: False
      SAFD:
        LOW_TERMS: 8
        MIDDLE_TERMS: 24
        RADII: [0.0, 0.3, 0.6, 0.8]
        ANGLES: 16
        MAX_SIGNALS: 96
        BATCH_SIZE: 2
        ORIGINAL_BLEND: [0.25, 0.1]
        MAX_DETAIL_RMS: 0.04
    UNCERTAINTY:
      ENABLED: True
      VIEW_CONTROL: "original"
      COVARIANCE: "full_shared"
      MEAN_UNCERTAINTY: False
      RIDGE: 1.0
      # Earlier CUB runs selected the previous upper bound, 1.0.
      RIDGE_GRID: [0.01, 0.1, 1.0, 10.0]
      AUTO_CALIBRATE: True
      ALPHA: 0.0
      ALPHA_GRID: [0.0, 0.05, 0.1, 0.2]
      TEMPERATURE: 1.0
      TEMPERATURE_GRID: [0.1, 0.3, 1.0]
      FIT_FRACTION: 0.5
      VAL_EPISODES: 20
      OLD_WAY: 10
      NEW_WAY: 5
      STAGES: 2
      OLD_SHOT: 20
      SHOT: 5
      QUERY: 5
    DUAL_FREQUENCY:
      ENABLED: True
      SEMANTIC_SOURCE: "explicit"
      SEMANTIC_PERMUTATION: [0, 1, 2]
      RESIDUALIZE: True
      ALIGNMENT: True
      MODE: "consensus"
      BAND_WEIGHTS: [1.0, 1.0, 1.0]
      SHOT_TAU: 5.0
      AUTO_CALIBRATE: True
      FIT_EPISODES: 20
      SCALE_EPS: 0.0001
      LAMBDA: 0.0
      LAMBDA_GRID: [0.0, 0.003, 0.01, 0.03, 0.1, 0.3, 0.6]
      MAX_GROUP_DROP_PP: 0.0
      BASE_ONLY: False
      SAVE_PREDICTIONS: True
